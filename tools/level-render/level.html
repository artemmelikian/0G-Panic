<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ── Мини-астронавты для капсул шкафа скафандров ──
const crewModels = {};
for (const n of ['bear', 'bunny', 'robotdog', 'cat']) {
  crewModels[n] = (await new GLTFLoader().loadAsync(`./models/${n}_astronaut.glb`)).scene;
}

// ── Материалы и текстуры ─────────────────────────────────────────────────
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.05, ...o });
const glow = (color, k = 1) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: k, roughness: 0.5 });
const canvasTex = (w, h, draw) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
};
const hazardTex = (w = 256, h = 32) => canvasTex(w, h, (g) => {
  g.fillStyle = '#2a2a2a'; g.fillRect(0, 0, w, h); g.fillStyle = '#f2c230';
  for (let x = -h; x < w + h; x += h) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + h / 2, 0); g.lineTo(x + h, 0); g.lineTo(x + h / 2, h); g.fill(); }
});

window.renderLevel = (C, WALLS, STATIONS, SCALE, MODE = 'hangar', X = {}) => {
  const tx = (t) => C.OX + t * C.TILE, ty = (t) => C.OY + t * C.TILE;
  const W0 = 1280, H0 = 720;

  // ── Камера как в игре (proj() из Hangar.js) ──
  const TILT = THREE.MathUtils.degToRad(C.CAMERA_TILT_DEG), PITCH = Math.PI / 2 - TILT;
  const CAM_TX = C.OX + C.GRID_W * C.TILE / 2, CAM_TY = C.OY + C.GRID_H * C.TILE / 2;
  const CAM_Y = CAM_TY + Math.cos(PITCH) * C.CAMERA_DIST, CAM_Z = Math.sin(PITCH) * C.CAMERA_DIST;
  const rawProj = (x, y, z) => {
    const ry = y - CAM_Y, rz = z - CAM_Z;
    const depth = -ry * Math.cos(PITCH) - rz * Math.sin(PITCH);
    const up = -ry * Math.sin(PITCH) + rz * Math.cos(PITCH);
    return { u: (x - CAM_TX) / depth, v: -up / depth };
  };
  const pts = [];
  for (const [gx, gy] of [[0, 0], [C.GRID_W, 0], [0, C.GRID_H], [C.GRID_W, C.GRID_H]])
    for (const z of [0, C.WALL_H]) pts.push(rawProj(C.OX + gx * C.TILE, C.OY + gy * C.TILE, z));
  const us = pts.map((p) => p.u), vs = pts.map((p) => p.v);
  const u0 = Math.min(...us), u1 = Math.max(...us), v0 = Math.min(...vs), v1 = Math.max(...vs);
  const SB = C.SCREEN_BOX;
  const k = Math.min((SB.r - SB.l) / (u1 - u0), (SB.b - SB.t) / (v1 - v0));
  const ox = (SB.l + SB.r) / 2 - k * (u0 + u1) / 2, oy = (SB.t + SB.b) / 2 - k * (v0 + v1) / 2;

  const W = Math.round(W0 * SCALE), H = Math.round(H0 * SCALE);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.localClippingEnabled = true;
  renderer.setClearColor(0x000000, 0);

  const cam = new THREE.PerspectiveCamera(45, W0 / H0, 10, 6000);
  cam.position.set(CAM_TX, CAM_Z, CAM_Y);
  cam.up.set(0, 1, 0);
  cam.lookAt(CAM_TX, 0, CAM_TY);
  cam.updateMatrixWorld();
  const n = 10;
  cam.projectionMatrix.makePerspective(-ox / k * n, (W0 - ox) / k * n, oy / k * n, (oy - H0) / k * n, n, 6000);
  cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();

  // ── Сцена и свет ──
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9bb8, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.9);
  sun.position.set(CAM_TX - 350, 900, CAM_TY + 500);
  sun.target.position.set(CAM_TX, 0, CAM_TY);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  Object.assign(sun.shadow.camera, { left: -800, right: 800, top: 800, bottom: -800, near: 10, far: 3000 });
  sun.shadow.bias = -0.0006; sun.shadow.radius = 4;
  scene.add(sun, sun.target);

  // мир (x, y, z-высота) → three (x, z, y)
  const statics = []; // { key, depth, group, slices? }
  const addMesh = (group, geo, mat, x, y, z) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, z, y);
    m.castShadow = !mat.transparent; m.receiveShadow = true; group.add(m); return m;
  };
  const B = (g, l, t, r, b, z0, z1, mat) => addMesh(g, new THREE.BoxGeometry(r - l, z1 - z0, b - t), mat, (l + r) / 2, (t + b) / 2, (z0 + z1) / 2);
  const CYL = (g, cx, cy, rad, z0, z1, mat, seg = 32) => addMesh(g, new THREE.CylinderGeometry(rad, rad, z1 - z0, seg), mat, cx, cy, (z0 + z1) / 2);
  // плоская картинка на южной грани (смотрит на камеру): x l..r, высота z0..z1, на глубине y
  const FACE = (g, l, r, y, z0, z1, mat) => {
    const m = addMesh(g, new THREE.PlaneGeometry(r - l, z1 - z0), mat, (l + r) / 2, y, (z0 + z1) / 2);
    m.castShadow = false; return m;
  };
  // плоская картинка сверху (на высоте z)
  const TOP = (g, l, t, r, b, z, mat) => {
    const m = addMesh(g, new THREE.PlaneGeometry(r - l, b - t), mat, (l + r) / 2, (t + b) / 2, z);
    m.rotation.x = -Math.PI / 2; m.castShadow = false; return m;
  };
  const texMat = (tex, o = {}) => new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, ...o });

  // ═══ Круглый корабль (MODE ship) и посадочная сцена (MODE surface) ═══
  // X: { ring: {cx, cy, R, wall, lift, door?}, rocks?: [[x,y,r]], bounds? }
  const buildRingStage = () => {
    const RG = X.ring, PX2 = 3;
    const floorG2 = new THREE.Group();
    // ── Поверхность планеты вокруг (только MODE surface)
    if (MODE === 'surface') {
      const GL = -900, GT = -700, GR = 2200, GB = 1150, PXG = 1.2;
      const ground = canvasTex(Math.round((GR - GL) * PXG), Math.round((GB - GT) * PXG), (g, w, h) => {
        const X2 = (x) => (x - GL) * PXG, Y2 = (y) => (y - GT) * PXG;
        const grd = g.createLinearGradient(0, 0, w, h); grd.addColorStop(0, '#b4532a'); grd.addColorStop(0.5, '#c46a3a'); grd.addColorStop(1, '#a9492a');
        g.fillStyle = grd; g.fillRect(0, 0, w, h);
        let sd = 3; const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
        // пятна и рябь
        for (let i = 0; i < 900; i++) {
          const x = rnd() * w, y = rnd() * h, r = 6 + rnd() * 60;
          g.fillStyle = rnd() < 0.5 ? `rgba(120,45,20,${0.05 + rnd() * 0.08})` : `rgba(230,150,95,${0.04 + rnd() * 0.08})`;
          g.beginPath(); g.ellipse(x, y, r, r * (0.4 + rnd() * 0.5), rnd() * 3, 0, Math.PI * 2); g.fill();
        }
        // кратеры
        for (let i = 0; i < 26; i++) {
          const x = rnd() * w, y = rnd() * h, r = 10 + rnd() * 46;
          g.fillStyle = 'rgba(95,35,15,0.35)'; g.beginPath(); g.ellipse(x, y, r, r * 0.8, 0, 0, Math.PI * 2); g.fill();
          g.strokeStyle = 'rgba(240,170,120,0.35)'; g.lineWidth = r * 0.18; g.beginPath(); g.ellipse(x - r * 0.08, y - r * 0.08, r, r * 0.8, 0, Math.PI * 1.0, Math.PI * 1.9); g.stroke();
        }
        // мелкие камушки
        for (let i = 0; i < 2600; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(80,30,12,0.55)' : 'rgba(235,170,120,0.5)'; g.beginPath(); g.arc(rnd() * w, rnd() * h, 0.8 + rnd() * 2.2, 0, Math.PI * 2); g.fill(); }
        // следы колёс/посадочные «ожоги» вокруг лендера
        const cx = X2(RG.cx), cy = Y2(RG.cy);
        const burn = g.createRadialGradient(cx, cy, RG.R * PXG * 0.9, cx, cy, RG.R * PXG * 1.7);
        burn.addColorStop(0, 'rgba(50,20,10,0.55)'); burn.addColorStop(1, 'rgba(50,20,10,0)');
        g.fillStyle = burn; g.beginPath(); g.arc(cx, cy, RG.R * PXG * 1.7, 0, Math.PI * 2); g.fill();
      });
      const gm = TOP(floorG2, GL, GT, GR, GB, -0.5, new THREE.MeshStandardMaterial({ map: ground, roughness: 1 }));
      gm.receiveShadow = true;
    }
    // ── Пол отсека: круг с плиткой, радиальными швами и перфорацией
    const FR2 = RG.R - RG.wall / 2 + 2;
    const fl = RG.cx - FR2, ft = RG.cy - FR2, size = FR2 * 2;
    const floorTex2 = canvasTex(Math.round(size * PX2), Math.round(size * PX2), (g, w, h) => {
      const X2 = (x) => (x - fl) * PX2, Y2 = (y) => (y - ft) * PX2, cx = X2(RG.cx), cy = Y2(RG.cy);
      g.save(); g.beginPath(); g.arc(cx, cy, FR2 * PX2, 0, Math.PI * 2); g.clip();
      g.fillStyle = '#e4e9f1'; g.fillRect(0, 0, w, h);
      for (let x = 0; x < size; x += C.TILE) for (let y = 0; y < size; y += C.TILE) { g.fillStyle = ((x + y) / C.TILE) % 2 ? '#e8edf4' : '#dfe5ee'; g.fillRect(x * PX2, y * PX2, C.TILE * PX2, C.TILE * PX2); }
      g.fillStyle = '#c3ccd9';
      for (let x = 5; x < size; x += 10) for (let y = 5; y < size; y += 10) { g.beginPath(); g.arc(x * PX2, y * PX2, 1.1 * PX2, 0, Math.PI * 2); g.fill(); }
      g.strokeStyle = '#c4cdda'; g.lineWidth = 1.5 * PX2;
      for (let x = 0; x <= size; x += C.TILE) { g.beginPath(); g.moveTo(x * PX2, 0); g.lineTo(x * PX2, h); g.stroke(); }
      for (let y = 0; y <= size; y += C.TILE) { g.beginPath(); g.moveTo(0, y * PX2); g.lineTo(w, y * PX2); g.stroke(); }
      // радиальные швы
      g.strokeStyle = '#b9c3d1'; g.lineWidth = 2.2 * PX2;
      for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2 + Math.PI / 8; g.beginPath(); g.moveTo(cx + Math.cos(a) * RG.lift * 1.2 * PX2, cy + Math.sin(a) * RG.lift * 1.2 * PX2); g.lineTo(cx + Math.cos(a) * FR2 * PX2, cy + Math.sin(a) * FR2 * PX2); g.stroke(); }
      // кольцо вокруг лифта
      g.strokeStyle = '#cfd6e1'; g.lineWidth = 10 * PX2; g.beginPath(); g.arc(cx, cy, (RG.lift + 14) * PX2, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = '#b9c3d1'; g.lineWidth = 1.5 * PX2; g.beginPath(); g.arc(cx, cy, (RG.lift + 20) * PX2, 0, Math.PI * 2); g.stroke();
      // светящаяся кромка пола у стены
      g.strokeStyle = 'rgba(110,220,255,0.7)'; g.lineWidth = 3 * PX2; g.beginPath(); g.arc(cx, cy, (FR2 - 6) * PX2, 0, Math.PI * 2); g.stroke();
      // грузовой лифт: тёмная сетка, жёлто-чёрное кольцо, пунктир, площадки
      const LR = RG.lift * PX2;
      g.fillStyle = '#8f98a4'; g.beginPath(); g.arc(cx, cy, LR, 0, Math.PI * 2); g.fill();
      g.save(); g.beginPath(); g.arc(cx, cy, LR * 0.86, 0, Math.PI * 2); g.clip();
      g.strokeStyle = '#a9b1bc'; g.lineWidth = 1.4 * PX2;
      for (let d = -LR; d < LR * 2; d += 8 * PX2) { g.beginPath(); g.moveTo(cx - LR + d, cy - LR); g.lineTo(cx - LR + d - LR * 2, cy + LR); g.stroke(); g.beginPath(); g.moveTo(cx - LR + d - LR * 2, cy - LR); g.lineTo(cx - LR + d, cy + LR); g.stroke(); }
      g.restore();
      const segs = 40;
      for (let i = 0; i < segs; i++) {
        const a0 = (i / segs) * Math.PI * 2, a1 = ((i + 1) / segs) * Math.PI * 2;
        g.fillStyle = i % 2 ? '#262626' : '#f2c230';
        g.beginPath(); g.arc(cx, cy, LR, a0, a1); g.arc(cx, cy, LR * 0.86, a1, a0, true); g.closePath(); g.fill();
      }
      g.setLineDash([7 * PX2, 6 * PX2]); g.strokeStyle = '#f2c230'; g.lineWidth = 2.5 * PX2;
      g.beginPath(); g.arc(cx, cy, LR * 0.42, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
      for (let i = 0; i < 4; i++) { const a = Math.PI / 4 + (i * Math.PI) / 2; g.fillStyle = '#f2c230'; g.beginPath(); g.arc(cx + Math.cos(a) * LR * 0.62, cy + Math.sin(a) * LR * 0.62, 9 * PX2 * (RG.lift / 105), 0, Math.PI * 2); g.fill(); }
      g.restore();
    });
    const fm = TOP(floorG2, fl, ft, fl + size, ft + size, 0.2, new THREE.MeshStandardMaterial({ map: floorTex2, roughness: 0.9, transparent: true, alphaTest: 0.5 }));
    fm.receiveShadow = true;
    scene.add(floorG2);

    // ── Стена-кольцо: высокая сзади, низкая спереди; иллюминатор в задней части; проём шлюза
    const ringG = new THREE.Group();
    const wallMat2 = std(0x37598f), capMat = std(0x5a7fb8), trim = std(0x2b4775), skirt = std(0x2a4677), cyan = glow(0x7fe6ff, 1.3);
    const glass = new THREE.MeshStandardMaterial({ color: 0x0b1230, roughness: 0.15, metalness: 0.2 });
    const N = 96, wt = RG.wall;
    const hAt = (a) => 18 + 44 * THREE.MathUtils.clamp((0.55 - Math.sin(a)) / 1.1, 0, 1);
    const inDoor = (deg) => RG.door && deg > RG.door[0] && deg < RG.door[1];
    const isWin = (deg) => MODE === 'ship' && deg > -113 && deg < -67;
    const seg = (a, len, z0, z1, mat, dr = 0, thick = wt) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(len, z1 - z0, thick), mat);
      m.position.set(RG.cx + Math.cos(a) * (RG.R + dr), (z0 + z1) / 2, RG.cy + Math.sin(a) * (RG.R + dr));
      m.rotation.y = -(a + Math.PI / 2);
      m.castShadow = true; m.receiveShadow = true; ringG.add(m); return m;
    };
    for (let i = 0; i < N; i++) {
      const a = ((i + 0.5) / N) * Math.PI * 2 - Math.PI, deg = (a * 180) / Math.PI;
      if (inDoor(deg)) continue;
      const len = (2 * Math.PI * (RG.R + wt / 2)) / N + 1.2, h = hAt(a);
      if (isWin(deg)) {
        seg(a, len, 0, 12, wallMat2); seg(a, len, 54, h, wallMat2);
        seg(a, len - 1, 12, 54, glass, -wt * 0.15, wt * 0.4);
        if (i % 3 === 0) seg(a, 2.2, 12, 54, capMat, -wt * 0.35, wt * 0.5); // переплёт
      } else seg(a, len, 0, h - 3, wallMat2);
      seg(a, len, h - 3, h, capMat, 0, wt + 2);
      seg(a, len, 0, 5, trim, 0, wt + 2);
      seg(a, len, 0, Math.max(6, h * 0.5), skirt, wt * 0.55, 4);           // наружная обшивка
      if (i % 2 === 0) seg(a, 1.6, 6, h - 6, std(0x2f4e80), wt / 2 + 0.6, 1.2); // рёбра снаружи
      seg(a, len, h - 9, h - 7, cyan, -wt / 2 - 0.4, 0.8);                  // голубая подсветка изнутри
      if (i % 6 === 3 && !isWin(deg)) seg(a, 8, 20, 26, glow(0xdfe8f5, 0.8), -wt / 2 - 0.6, 1);
    }
    // косяки шлюза
    if (RG.door) for (const dd of RG.door) {
      const a = (dd * Math.PI) / 180;
      const jm = new THREE.Mesh(new THREE.BoxGeometry(10, 74, wt + 10), std(0x5a86c6));
      jm.position.set(RG.cx + Math.cos(a) * RG.R, 37, RG.cy + Math.sin(a) * RG.R); jm.rotation.y = -(a + Math.PI / 2); jm.castShadow = true; ringG.add(jm);
      const led = new THREE.Mesh(new THREE.BoxGeometry(3, 5, wt + 11), glow(0xffb020, 1.5));
      led.position.set(RG.cx + Math.cos(a) * RG.R, 60, RG.cy + Math.sin(a) * RG.R); led.rotation.y = -(a + Math.PI / 2); ringG.add(led);
    }
    scene.add(ringG);
    statics.push({ key: 'ring', group: ringG, t: RG.cy - RG.R - wt, b: RG.cy + RG.R + wt, bias: -0.5 });

    // ── Камни и опоры лендера снаружи
    if (MODE === 'surface') {
      for (const [x, y, r] of X.rocks || []) {
        const g = new THREE.Group();
        const geo = new THREE.IcosahedronGeometry(r, 1);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) { const k = 0.75 + ((Math.sin(i * 12.9898 + x) * 43758.5453) % 1 + 1) % 1 * 0.45; pos.setXYZ(i, pos.getX(i) * k, pos.getY(i) * k * 0.6, pos.getZ(i) * k); }
        geo.computeVertexNormals();
        const m = addMesh(g, geo, std(0x8a3f22, { roughness: 1, flatShading: true }), x, y, r * 0.25);
        m.rotation.y = x * 0.1;
        scene.add(g); statics.push({ key: `rock_${x}_${y}`, group: g, t: y - r, b: y + r * 0.6 });
      }
      for (const d of [45, 135, 225, 315]) {
        const a = (d * Math.PI) / 180, g = new THREE.Group();
        const x0 = RG.cx + Math.cos(a) * (RG.R + 6), y0 = RG.cy + Math.sin(a) * (RG.R + 6), x1 = RG.cx + Math.cos(a) * (RG.R + 46), y1 = RG.cy + Math.sin(a) * (RG.R + 46);
        { const curve = new THREE.CatmullRomCurve3([[x0, y0, 22], [(x0 + x1) / 2, (y0 + y1) / 2, 14], [x1, y1, 3]].map(([a1, b1, c1]) => new THREE.Vector3(a1, c1, b1)));
          const tm = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 3.2, 8, false), std(0xc9ced8, { metalness: 0.4 })); tm.castShadow = true; g.add(tm); }
        CYL(g, x1, y1, 12, 0, 3, std(0x9aa3ae));
        scene.add(g); statics.push({ key: `leg_${d}`, group: g, t: Math.min(y0, y1) - 12, b: Math.max(y0, y1) + 12 });
      }
    }
    return floorG2;
  };

  let floorG;
  if (MODE === 'hangar') {
  // ── Пол ─────────────────────────────────────────────────────────────────
  const FL = tx(0), FT = ty(0), FR = tx(C.GRID_W), FB = ty(C.GRID_H);
  const PX = 3; // пикселей текстуры на мировой px
  const floorTex = canvasTex((FR - FL) * PX, (FB - FT) * PX, (g, w, h) => {
    const X = (x) => (x - FL) * PX, Y = (y) => (y - FT) * PX;
    g.fillStyle = '#e4e9f1'; g.fillRect(0, 0, w, h);
    // плитка 40 px: тонкие швы и точечная перфорация
    for (let i = 0; i <= C.GRID_W; i++) for (let j = 0; j <= C.GRID_H; j++) {
      g.fillStyle = (i + j) % 2 ? '#e8edf4' : '#dfe5ee';
      g.fillRect(X(tx(i)), Y(ty(j)), C.TILE * PX, C.TILE * PX);
    }
    g.fillStyle = '#c3ccd9';
    for (let x = FL + 5; x < FR; x += 10) for (let y = FT + 5; y < FB; y += 10) {
      g.beginPath(); g.arc(X(x), Y(y), 1.1 * PX, 0, Math.PI * 2); g.fill();
    }
    g.strokeStyle = '#c4cdda'; g.lineWidth = 1.5 * PX;
    for (let i = 0; i <= C.GRID_W; i++) { g.beginPath(); g.moveTo(X(tx(i)), 0); g.lineTo(X(tx(i)), h); g.stroke(); }
    for (let j = 0; j <= C.GRID_H; j++) { g.beginPath(); g.moveTo(0, Y(ty(j))); g.lineTo(w, Y(ty(j))); g.stroke(); }
    // разметка «опасная зона»
    const hazardRect = (l, t, r, b, band) => {
      const seg = band * 1.4;
      const edge = (x0, y0, x1, y1, nx, ny) => {
        const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
        for (let d = 0, i = 0; d < len; d += seg, i++) {
          const e = Math.min(len, d + seg);
          g.fillStyle = i % 2 ? '#262626' : '#f2c230';
          g.beginPath();
          g.moveTo(X(x0 + ux * d), Y(y0 + uy * d)); g.lineTo(X(x0 + ux * e), Y(y0 + uy * e));
          g.lineTo(X(x0 + ux * e + nx * band), Y(y0 + uy * e + ny * band)); g.lineTo(X(x0 + ux * d + nx * band), Y(y0 + uy * d + ny * band));
          g.fill();

      const { l, t, r, b } = s;
      B(g, l + 2, t, r - 2, t + 8, 0, 70, std(0x2f4f86));
      B(g, l + 2, t, r - 2, b, 0, 5, std(0x3c63a8));
      const n = 2, sp = (r - l) / n;
      for (let i = 0; i < n; i++) {
        const cx = l + sp * (i + 0.5), cy = (t + b) / 2 - 2;
        const m = crewModels[['bear', 'cat'][i]].clone(true);
        m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        const k = 25 * 0.8; m.scale.set(k, k, k); m.position.set(cx, 5, cy); m.rotation.y = 0;
        g.add(m);
        addMesh(g, new THREE.TorusGeometry(sp * 0.36, 1.6, 8, 32), glow(0x7cc04a, 1.1), cx, cy, 5.5).rotation.x = Math.PI / 2;
      }
    },
  });

  const ringRect2 = (def) => { const a = def.at[0] * Math.PI / 180, x = X.ring.cx + Math.cos(a) * def.at[1], y = X.ring.cy + Math.sin(a) * def.at[1];
    return { l: x - def.size[0] / 2, t: y - def.size[1] / 2, r: x + def.size[0] / 2, b: y + def.size[1] / 2 }; };
  for (const def of STATIONS) {
    let l, t, r, b;
    if (MODE === 'hangar') {
      const [x, y, w, h] = def.rect;
      l = Math.max(tx(x), tx(0) + C.WALL / 2); t = Math.max(ty(y), ty(0) + C.WALL / 2);
      r = Math.min(tx(x + w), tx(C.GRID_W) - C.WALL / 2); b = Math.min(ty(y + h), ty(C.GRID_H) - C.WALL / 2);
    } else ({ l, t, r, b } = ringRect2(def));
    if (def.zone) {
      // стойка табло весов (те же размеры, что в Hangar.js → buildScaleZone)
      const cx = (l + r) / 2, sw = 64, sl = cx - sw / 2, sr = cx + sw / 2, sb = t - 2, stt = sb - 10, sh = 56;
      const g = new THREE.Group();
      B(g, sl + 20, stt + 2, sr - 20, sb - 2, 0, 16, std(0x5b6578));
      B(g, sl, stt, sr, sb, 16, sh, std(0x2a2f3c));
      B(g, sl - 1, stt - 1, sr + 1, sb + 1, sh, sh + 2, std(0x3a4150));
      FACE(g, sl + 4, sr - 4, sb + 0.6, 20, sh - 4, std(0x07090f));
      statics.push({ key: 'scale_display', group: g, t: stt, b: sb });
      scene.add(g);
      continue;
    }
    const g = new THREE.Group();
    (looks[def.look] || ((gg, s) => B(gg, s.l, s.t, s.r, s.b, 0, def.high ? C.HIGH_H : C.LOW_H, std(0x47507c))))(g, { l, t, r, b });
    statics.push({ key: 'st_' + def.id, group: g, t, b });
    scene.add(g);
  }

  // ── Рендер слоями ──────────────────────────────────────────────────────
  const occluder = new THREE.MeshBasicMaterial({ colorWrite: false, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 4 });
  const ghost = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
  const meshesOf = (g) => { const a = []; g.traverse((o) => { if (o.isMesh) a.push(o); }); return a; };
  for (const s of statics) {
    s.meshes = meshesOf(s.group);
    for (const m of s.meshes) m.userData.orig = m.material;
  }
  const floorMeshes = meshesOf(floorG);

  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const octx = out.getContext('2d', { willReadFrequently: true });
  const grab = () => {
    octx.clearRect(0, 0, W, H); octx.drawImage(renderer.domElement, 0, 0);
    const d = octx.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 2) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0) return null;
    const c = document.createElement('canvas'); c.width = x1 - x0 + 1; c.height = y1 - y0 + 1;
    c.getContext('2d').drawImage(out, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
    return { x: x0 / SCALE, y: y0 / SCALE, data: c.toDataURL('image/png') };
  };

  const layers = [];
  // 1) Пол: объекты невидимы, но отбрасывают тени
  for (const s of statics) for (const m of s.meshes) { m.material = ghost; m.visible = !m.userData.orig.transparent; }
  for (const m of floorMeshes) m.visible = true;
  renderer.render(scene, cam);
  { const L = grab(); layers.push({ key: 'floor', depth: -1000, ...L }); }

  // 2) Каждый объект (длинные — ломтиками по полклетки) с остальными как невидимыми «заслонками»
  for (const m of floorMeshes) m.visible = false;
  const SLICE = C.TILE / 2;
  for (const s of statics) {
    const parts = [];
    if (!s.noSlice && s.b - s.t > C.TILE * 2) {
      for (let y0 = s.t; y0 < s.b - 0.01; y0 += SLICE) parts.push([y0, Math.min(s.b, y0 + SLICE)]);
    } else parts.push([s.t, s.b]);
    parts.forEach(([y0, y1], i) => {
      const lo = i === 0 ? -1e5 : y0, hi = i === parts.length - 1 ? 1e5 : y1;
      const planes = [new THREE.Plane(new THREE.Vector3(0, 0, 1), -lo), new THREE.Plane(new THREE.Vector3(0, 0, -1), hi)];
      for (const o of statics) for (const m of o.meshes) {
        const orig = m.userData.orig;
        if (o === s) { m.visible = true; m.material = orig; orig.clippingPlanes = planes; m.renderOrder = 0; }
        else { m.visible = !orig.transparent; m.material = occluder; m.renderOrder = -1; }
      }
      renderer.render(scene, cam);
      for (const m of s.meshes) m.userData.orig.clippingPlanes = null;
      const L = grab();
      if (!L) return;
      const depth = s.depth !== undefined && s.depth !== null ? s.depth : y1 + (s.bias || 0);
      layers.push({ key: `${s.key}_${i}`.replace(/\./g, '-'), depth, ...L });
    });
  }
  // 3) Превью целиком (для проверки)
  for (const o of statics) for (const m of o.meshes) { m.visible = true; m.material = m.userData.orig; m.renderOrder = 0; }
  for (const m of floorMeshes) m.visible = true;
  renderer.setClearColor(0x2c5287, 1);
  renderer.render(scene, cam);
  octx.clearRect(0, 0, W, H); octx.drawImage(renderer.domElement, 0, 0);
  const preview = out.toDataURL('image/png');
  return { layers, preview };
};
window.READY = true;
</script></body></html>
