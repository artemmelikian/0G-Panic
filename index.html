<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Launch Rush</title>
  <style>html, body { margin: 0; height: 100%; background: #2c5287; overflow: hidden; } #game { width: 100vw; height: 100vh; }</style>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <!-- Грузим код с меткой времени, чтобы браузер не брал старую версию из кеша -->
  <script type="module">
    window.BUILD = Date.now();
    import('./src/main.js?v=' + window.BUILD);
  </script>
</body>
</html>
